<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>X Book. - Connecting Minds</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@800&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════
   X BOOK - PREMIUM UI SYSTEM
═══════════════════════════════════════ */
:root {
  --bg: #000000;
  --surface: #000000;
  --surface-hover: #0f1419;
  --border: #2f3336;
  --accent: #1d9bf0;
  --accent-hover: #1a8cd8;
  --text: #e7e9ea;
  --muted: #71767b;
  --red: #f91880;
  --green: #00ba7c;
  --glass: rgba(0, 0, 0, 0.75);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.3; }

/* ── PAGE SYSTEM ── */
.page { display: none; min-height: 100vh; }
.page.active { display: block; }

/* ── AUTH UI ── */
.auth-container { max-width: 400px; margin: 100px auto; padding: 20px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); text-align: center; }
.auth-logo { font-family: 'Syne', sans-serif; font-size: 40px; margin-bottom: 20px; }
.auth-input { width: 100%; padding: 12px; margin: 8px 0; background: transparent; border: 1px solid var(--border); border-radius: 4px; color: white; outline: none; }
.auth-btn { width: 100%; padding: 12px; background: white; color: black; border: none; border-radius: 999px; font-weight: 700; cursor: pointer; margin-top: 15px; }

/* ── APP LAYOUT ── */
.app-container { display: flex; max-width: 1250px; margin: 0 auto; min-height: 100vh; }

/* Sidebar */
.sidebar { width: 275px; padding: 0 12px; border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.nav-link { display: flex; align-items: center; gap: 20px; padding: 12px; width: fit-content; border-radius: 999px; color: var(--text); text-decoration: none; font-size: 19px; margin: 4px 0; transition: 0.2s; cursor: pointer; }
.nav-link:hover { background: var(--surface-hover); }
.nav-link svg { width: 26px; height: 26px; fill: currentColor; }

/* Main Feed */
.main-feed { flex: 1; max-width: 600px; border-right: 1px solid var(--border); }
.feed-header { position: sticky; top: 0; background: var(--glass); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 100; padding: 16px; font-weight: 800; font-size: 20px; }

/* Post Input */
.post-box { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
.avatar-sm { width: 45px; height: 45px; border-radius: 50%; background: #333; object-fit: cover; }
.input-area { flex: 1; }
.input-area textarea { width: 100%; background: transparent; border: none; outline: none; color: white; font-size: 19px; resize: none; margin-bottom: 10px; }
.post-btn { background: var(--accent); color: white; border: none; border-radius: 999px; padding: 8px 18px; font-weight: 700; float: right; cursor: pointer; }

/* Post Cards */
.post-card { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
.post-content { flex: 1; }
.user-info { display: flex; gap: 5px; align-items: center; margin-bottom: 4px; }
.name { font-weight: 700; }
.handle { color: var(--muted); }
.post-text { margin-bottom: 12px; word-break: break-word; }
.post-img { width: 100%; border-radius: 16px; border: 1px solid var(--border); }
.post-stats { display: flex; justify-content: space-between; max-width: 400px; color: var(--muted); margin-top: 10px; }
.stat { display: flex; align-items: center; gap: 5px; cursor: pointer; transition: 0.2s; }
.stat:hover { color: var(--accent); }

/* Right Panel */
.right-panel { width: 350px; padding: 12px 25px; }
.trend-card { background: #16181c; border-radius: 16px; padding: 15px; margin-top: 20px; }

/* Toast */
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 10px 20px; border-radius: 8px; display: none; z-index: 1000; }

@media (max-width: 1000px) { .sidebar { width: 80px; } .nav-text { display: none; } }
@media (max-width: 700px) { .sidebar, .right-panel { display: none; } .main-feed { max-width: 100%; } }
</style>
</head>
<body>

<div id="toast"></div>

<div id="page-login" class="page active">
  <div class="auth-container">
    <div class="auth-logo">X Book.</div>
    <h2 style="margin-bottom: 20px;">Log in to X</h2>
    <input type="email" id="l-email" class="auth-input" placeholder="Email">
    <input type="password" id="l-pass" class="auth-input" placeholder="Password">
    <button class="auth-btn" onclick="doLogin()">Log in</button>
    <p style="margin-top: 20px; color: var(--muted);">Don't have an account? <a onclick="showPage('signup')" style="color: var(--accent); cursor: pointer;">Sign up</a></p>
  </div>
</div>

<div id="page-signup" class="page">
  <div class="auth-container">
    <div class="auth-logo">X Book.</div>
    <h2>Create your account</h2>
    <input type="text" id="su-name" class="auth-input" placeholder="Display Name">
    <input type="text" id="su-username" class="auth-input" placeholder="Username (e.g. mehebub)">
    <input type="email" id="su-email" class="auth-input" placeholder="Email">
    <input type="password" id="su-pass" class="auth-input" placeholder="Password">
    <button class="auth-btn" onclick="doSignup()">Sign up</button>
    <p style="margin-top: 20px; color: var(--muted);">Have an account? <a onclick="showPage('login')" style="color: var(--accent); cursor: pointer;">Log in</a></p>
  </div>
</div>

<div id="page-app" class="page">
  <div class="app-container">
    <aside class="sidebar">
      <div class="auth-logo" style="padding: 12px;">X</div>
      <div class="nav-link" onclick="location.reload()">
        <svg viewBox="0 0 24 24"><path d="M21.58 13.06l-8.268-8.282c-.703-.704-1.85-.704-2.554 0L2.49 13.06c-.452.453-.578 1.13-.314 1.71.264.58.845.956 1.48.956h1.91V20c0 .552.448 1 1 1h5.38v-3.5h1.12V21h5.38c.552 0 1-.448 1-1v-4.274h1.908c.635 0 1.216-.376 1.48-.956.264-.58.138-1.257-.314-1.71z"/></svg>
        <span class="nav-text">Home</span>
      </div>
      <div class="nav-link">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-7c-1.38 0-2.5 1.12-2.5 2.5s1.12 2.5 2.5 2.5 2.5-1.12 2.5-2.5-1.12-2.5-2.5-2.5z"/></svg>
        <span class="nav-text">Profile</span>
      </div>
      <div class="nav-link" onclick="doLogout()" style="margin-top: auto; margin-bottom: 20px;">
        <span class="nav-text">Logout</span>
      </div>
    </aside>

    <main class="main-feed">
      <div class="feed-header">Home</div>
      
      <div class="post-box">
        <img src="https://i.ibb.co/vz6vP68/user-placeholder.png" id="me-avatar" class="avatar-sm">
        <div class="input-area">
          <textarea id="post-text" placeholder="What is happening?!" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
          <input type="file" id="post-file" style="display:none" onchange="handleFile(this)">
          <div style="display:flex; justify-content:space-between; align-items:center;">
             <span onclick="document.getElementById('post-file').click()" style="color:var(--accent); cursor:pointer;">📷 Image</span>
             <button class="post-btn" id="post-btn" onclick="submitPost()">Post</button>
          </div>
          <div id="upload-status" style="font-size:12px; color:var(--muted); margin-top:5px;"></div>
        </div>
      </div>

      <div id="posts-feed">
         <div style="padding:40px; text-align:center; color:var(--muted);">Loading posts...</div>
      </div>
    </main>

    <aside class="right-panel">
      <div class="trend-card">
        <h3 style="margin-bottom:15px;">Trends for you</h3>
        <div style="margin-bottom:15px;">
           <div style="font-size:13px; color:var(--muted);">Trending in Bangladesh</div>
           <div style="font-weight:700;">#XBookBeta</div>
           <div style="font-size:13px; color:var(--muted);">2.5K Posts</div>
        </div>
        <div style="margin-bottom:15px;">
           <div style="font-size:13px; color:var(--muted);">Technology · Trending</div>
           <div style="font-weight:700;">Mehebub Hasan</div>
           <div style="font-size:13px; color:var(--muted);">1.2K Posts</div>
        </div>
      </div>
    </aside>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, query, orderBy, serverTimestamp, increment, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Your Firebase Config (Using your provided ID)
const firebaseConfig = {
  apiKey: "AIzaSyBzjKTn4CzMrWoKu6BovnhvS2wKfEZ3xfc",
  authDomain: "deepme-14339.firebaseapp.com",
  projectId: "deepme-14339",
  storageBucket: "deepme-14339.firebasestorage.app",
  messagingSenderId: "1077968686497",
  appId: "1:1077968686497:web:a84a677edcea6ab6890fe0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const imgbbKey = "9ef8429562cece7ca596da3a9f039d8a";

let ME = null;
let uploadedImageUrl = "";

// ── UTILS ──
window.showPage = (id) => {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
};

const toast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
};

// ── AUTH LOGIC ──
window.doLogin = async () => {
  const e = document.getElementById('l-email').value;
  const p = document.getElementById('l-pass').value;
  try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { alert(err.message); }
};

window.doSignup = async () => {
  const name = document.getElementById('su-name').value;
  const user = document.getElementById('su-username').value.toLowerCase();
  const email = document.getElementById('su-email').value;
  const pass = document.getElementById('su-pass').value;
  
  try {
    const res = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, "users", res.user.uid), {
      uid: res.user.uid,
      displayName: name,
      username: user,
      email: email,
      createdAt: serverTimestamp()
    });
  } catch(err) { alert(err.message); }
};

window.doLogout = () => signOut(auth);

// ── FILE UPLOAD ──
window.handleFile = async (input) => {
  const file = input.files[0]; if(!file) return;
  document.getElementById('upload-status').textContent = "Uploading image...";
  const formData = new FormData();
  formData.append("image", file);
  
  try {
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, { method: "POST", body: formData });
    const data = await res.json();
    uploadedImageUrl = data.data.url;
    document.getElementById('upload-status').textContent = "Image ready! ✅";
  } catch(err) { toast("Upload failed"); }
};

// ── POST LOGIC ──
window.submitPost = async () => {
  const text = document.getElementById('post-text').value.trim();
  if(!text && !uploadedImageUrl) return;

  const btn = document.getElementById('post-btn');
  btn.disabled = true; btn.textContent = "Posting...";

  try {
    await addDoc(collection(db, "posts"), {
      uid: ME.uid,
      displayName: ME.displayName,
      username: ME.username,
      text: text,
      image: uploadedImageUrl,
      createdAt: serverTimestamp(),
      likes: 0
    });
    document.getElementById('post-text').value = "";
    uploadedImageUrl = "";
    document.getElementById('upload-status').textContent = "";
    loadPosts();
  } catch(err) { toast("Error posting"); }
  btn.disabled = false; btn.textContent = "Post";
};

// ── LOAD FEED ──
const loadPosts = async () => {
  const feed = document.getElementById('posts-feed');
  const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
  const snap = await getDocs(q);
  
  feed.innerHTML = "";
  snap.forEach(d => {
    const p = d.data();
    feed.innerHTML += `
      <div class="post-card">
        <img src="https://i.ibb.co/vz6vP68/user-placeholder.png" class="avatar-sm">
        <div class="post-content">
          <div class="user-info">
            <span class="name">${p.displayName}</span>
            <span class="handle">@${p.username}</span>
          </div>
          <div class="post-text">${p.text || ""}</div>
          ${p.image ? `<img src="${p.image}" class="post-img">` : ""}
          <div class="post-stats">
             <div class="stat">💬 0</div>
             <div class="stat">🔄 0</div>
             <div class="stat">❤️ ${p.likes || 0}</div>
             <div class="stat">📊 0</div>
          </div>
        </div>
      </div>
    `;
  });
};

// ── AUTH OBSERVER ──
onAuthStateChanged(auth, async (user) => {
  if(user) {
    const snap = await getDoc(doc(db, "users", user.uid));
    ME = snap.data();
    showPage('app');
    loadPosts();
  } else {
    showPage('login');
  }
});
</script>
</body>
      </html>
